<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — EduSphere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-side">
    <span class="brand" style="color:#fff;"><span class="brand-mark">✦</span> EduSphere</span>
    <h2>Start your learning journey today.</h2>
    <p>Join thousands of students and pick up new skills, entirely at your own pace.</p>
    <div class="orbit-card c1" style="position:relative; top:0; left:0; margin-top:40px; width:fit-content;">
      <b>🚀 Completely free</b>
      <span>No credit card required</span>
    </div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <h1>Create an account ✨</h1>
      <p>It only takes a few seconds to start learning</p>

      <div class="form-error" id="formError"></div>

      <form id="registerForm">
        <div class="field">
          <label>Who are you joining as?</label>
          <div class="role-select">
            <div class="role-opt selected" data-role="student">🎓 Student</div>
            <div class="role-opt" data-role="teacher">👨‍🏫 Teacher</div>
          </div>
        </div>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
