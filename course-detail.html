<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Detail — EduSphere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">✦</span> EduSphere</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html" class="active">Courses</a></li>
    </ul>
    <div class="nav-actions">
      <div data-auth-area style="display:flex; gap:10px;"></div>
      <button class="nav-toggle">☰</button>
    </div>
  </div>
</nav>

<div id="courseDetailWrap">
  <header style="background:var(--navy); padding:56px 0; color:#fff;">
    <div class="container" style="display:flex; align-items:center; gap:22px;">
      <div style="width:76px;height:76px;border-radius:18px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:36px;" id="courseThumb"></div>
      <div>
        <span class="pill" style="background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2); color:#C9CCFF;" id="courseCategory"></span>
        <h1 style="color:#fff; font-size:28px; margin-top:10px;" id="courseTitle">Loading...</h1>
        <p style="color:#B7B9E0; margin-top:6px;" id="courseTeacher"></p>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container" style="display:grid; grid-template-columns:1.6fr 1fr; gap:32px; align-items:start;">
      <div>
        <div class="card" style="margin-bottom:24px;">
          <h3 style="margin-bottom:10px;">About this course</h3>
          <p id="courseDesc" style="color:var(--text-muted);"></p>
        </div>

        <div class="card">
          <div class="card-title">📚 Course lessons</div>
          <div id="lessonList"></div>
        </div>

        <div class="card" id="teacherPanel" style="display:none; margin-top:24px;">
          <div class="card-title">➕ Add a new lesson</div>
          <form id="addLessonForm">
            <div class="field">
              <label for="lessonTitle">Lesson title</label>
              <input type="text" id="lessonTitle" placeholder="e.g. CSS Grid Basics" required>
            </div>
            <div class="field">
              <label for="lessonContent">Details</label>
              <textarea id="lessonContent" rows="3" placeholder="What will this lesson cover..."></textarea>
            </div>
            <div class="field">
              <label for="lessonVideo">Video link (YouTube / Vimeo / direct .mp4)</label>
              <input type="text" id="lessonVideo" placeholder="https://youtube.com/watch?v=...">
            </div>
            <button type="submit" class="btn btn-primary">➕ Add lesson</button>
          </form>
        </div>
      </div>

      <aside>
        <div class="card">
          <div id="enrollBox"></div>
          <div style="margin-top:20px; display:flex; flex-direction:column; gap:14px; font-size:14px;">
            <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted)">Level</span><b id="courseLevel"></b></div>
            <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted)">Duration</span><b id="courseDuration"></b></div>
            <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted)">Students</span><b id="courseStudents"></b></div>
          </div>
        </div>
      </aside>
    </div>
  </section>
</div>

<!-- Video player modal -->
<div class="modal-overlay" id="videoModalOverlay">
  <div class="modal" style="max-width:720px;">
    <div class="modal-head">
      <h3 id="videoModalTitle">▶ Lesson video</h3>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div id="videoFrameWrap"></div>
  </div>
</div>

<!-- Quick note modal (opened from a lesson) -->
<div class="modal-overlay" id="quickNoteOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>📝 Lesson note</h3>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <form id="quickNoteForm">
      <input type="hidden" id="quickNoteCourseId">
      <input type="hidden" id="quickNoteLessonId">
      <div class="field">
        <label for="quickNoteTitle">Title</label>
        <input type="text" id="quickNoteTitle" required>
      </div>
      <div class="field">
        <label for="quickNoteContent">Write your note</label>
        <textarea id="quickNoteContent" rows="5" placeholder="Save the important points here..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save note</button>
    </form>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/course-detail.js"></script>
</body>
</html>
